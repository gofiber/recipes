services:
  postgresql:
    image: postgres:19
    restart: always
    container_name: postgres
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: fiber_demo
    volumes:
      # Postgres 18 keeps its data in a versioned subdirectory of /var/lib/postgresql,
      # so mount that directory. A mount at /var/lib/postgresql/data makes the container exit.
      - ./data/postgres/:/var/lib/postgresql
